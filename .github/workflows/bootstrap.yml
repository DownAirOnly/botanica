name: Import Botanica source
on:
  push:
    paths: ['bootstrap/source.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand complete source package
        run: |
          test -s bootstrap/source.b64
          mkdir -p /tmp/botanica-bootstrap
          base64 -d bootstrap/source.b64 | tar -xJ -C /tmp/botanica-bootstrap
          cp -a /tmp/botanica-bootstrap/botanica/. .
          rm -rf bootstrap .github/workflows/bootstrap.yml
      - name: Commit source files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: initialize complete Botanica v3 app"
          git push origin HEAD:main
